# Configuração de publicação do Netlify.
#
# Agora que o frontend está na raiz do projeto, não é preciso configurar
# "Base directory" nem "Publish directory" na interface do Netlify — o
# valor abaixo (".") já resolve isso sozinho.
#
# O Netlify só serve arquivos estáticos — ele NÃO roda o backend em
# Python. A pasta "backend/" continua no mesmo repositório (para o
# Render usar), mas o bloco [[redirects]] abaixo impede que ela seja
# acessada publicamente pelo site do Netlify.

[build]
  publish = "."

# Bloqueia qualquer tentativa de acessar a pasta backend/ pelo site do Netlify.
[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true

# Página inicial do site.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
