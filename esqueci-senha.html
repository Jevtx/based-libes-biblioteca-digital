<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recuperar senha | Biblioteca Digital</title>
<meta content="Recupere o acesso à sua conta na Biblioteca Digital." name="description"/>
<link href="css/style.css" rel="stylesheet"/>

</head>
<body class="auth-page auth-recovery-page">
<!-- =====================================================
         NAVBAR
         ===================================================== -->
<header class="navbar-wrapper">
<nav class="navbar">
<a class="brand" href="index.html">
<span class="brand-icon">
                    ✦
                </span>
<span>
                    Biblioteca
                </span>
</a>
<div class="nav-links">
<a class="nav-link" href="index.html">
                    Início
                </a>
<a class="nav-link" href="livros.html">
                    Livros
                </a>
</div>
<a class="nav-login" href="login.html">
                Entrar
            </a>
</nav>
</header>
<!-- =====================================================
         CONTEÚDO
         ===================================================== -->
<main class="auth-page">
<section aria-labelledby="tituloRecuperacao" class="auth-card">
<span class="auth-label">
                RECUPERAÇÃO DE ACESSO
            </span>
<h1 id="tituloRecuperacao">
                Esqueceu sua senha?
            </h1>
<p>
                Informe o e-mail cadastrado.
                Se a conta existir, enviaremos
                as instruções para criar uma
                nova senha.
            </p>
<!-- =================================================
                 FORMULÁRIO
                 ================================================= -->
<form class="auth-form" id="recuperacaoForm" novalidate="">
<div class="form-group">
<label for="email">
                        E-mail
                    </label>
<input autocomplete="email" id="email" name="email" placeholder="seuemail@exemplo.com" required="" type="email"/>
</div>
<button class="auth-submit" id="recuperacaoSubmit" type="submit">
                    Enviar instruções
                </button>
<div aria-live="polite" class="auth-message" hidden="" id="recuperacaoMessage" role="alert"></div>
</form>
<div class="auth-footer">
<a href="login.html">
                    Voltar para o login
                </a>
</div>
</section>
</main>
<!-- =====================================================
         JAVASCRIPT
         ===================================================== -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
